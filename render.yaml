services:
  - type: web
    name: h2s-safety-platform
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.13.0

